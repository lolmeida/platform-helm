{{- $root := . -}}
{{- range $name, $job := .Values.bootstrapJobs }}
{{- if $job.enabled }}
{{- if not $job.image }}{{ fail (printf "bootstrapJobs.%s.image is required" $name) }}{{ end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $job.name | default (printf "%s-%s" (include "platform-workload.fullname" $root) $name) }}
  namespace: {{ include "platform-workload.namespace" $root }}
  labels:
    {{- include "platform-workload.labels" $root | nindent 4 }}
spec:
  backoffLimit: {{ $job.backoffLimit | default 3 }}
  template:
    metadata:
      labels:
        {{- include "platform-workload.labels" $root | nindent 8 }}
    spec:
      restartPolicy: {{ $job.restartPolicy | default "OnFailure" }}
      automountServiceAccountToken: {{ $job.automountServiceAccountToken | default false }}
      containers:
        - name: {{ $job.containerName | default $name }}
          image: {{ include "platform-workload.image" (dict "image" $job.image) | quote }}
          {{- with $job.command }}
          command: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $job.args }}
          args: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $job.env }}
          env:
            {{- range $key, $value := . }}
            - name: {{ $key }}
              value: {{- if contains "{{" ($value | toString) }} {{ tpl ($value | toString) $root | quote }}{{- else }} {{ $value | quote }}{{- end }}
            {{- end }}
          {{- end }}
          {{- with $job.secretEnv }}
          {{- if not $job.env }}env:{{ end }}
            {{- range $key, $value := . }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef: {name: {{ required "bootstrap secretEnv.name is required" $value.name }}, key: {{ required "bootstrap secretEnv.key is required" $value.key }}}
            {{- end }}
          {{- end }}
          {{- with $job.secretRefs }}
          envFrom:
            {{- range . }}
            - secretRef: {name: {{ . }}}
            {{- end }}
          {{- end }}
{{- end }}
{{- end }}
