{{- $root := . -}}
{{- range $name, $secret := .Values.externalSecrets }}
{{- if $secret.enabled }}
{{- if not $secret.secretStoreRef }}{{ fail (printf "externalSecrets.%s.secretStoreRef is required" $name) }}{{ end }}
---
apiVersion: {{ $secret.apiVersion | default "external-secrets.io/v1beta1" }}
kind: ExternalSecret
metadata:
  name: {{ $secret.targetName | default $name }}
  namespace: {{ include "platform-workload.namespace" $root }}
  labels:
    {{- include "platform-workload.labels" $root | nindent 4 }}
spec:
  refreshInterval: {{ $secret.refreshInterval | default "1h" }}
  secretStoreRef: {{- toYaml $secret.secretStoreRef | nindent 4 }}
  target:
    name: {{ $secret.targetName | default $name }}
    creationPolicy: {{ $secret.creationPolicy | default "Owner" }}
  data:
    {{- range .data }}
    - secretKey: {{ required "external secretKey is required" .secretKey }}
      remoteRef: {key: {{ required "external remoteRef.key is required" .remoteRef.key }}}
    {{- end }}
{{- end }}
{{- end }}
