{{- if .Values.runtimeConfig }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "platform-workload.fullname" . }}-runtime
  namespace: {{ include "platform-workload.namespace" . }}
  labels:
    {{- include "platform-workload.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.runtimeConfig }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
{{- range $name, $config := .Values.configMaps }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $config.name | default (printf "%s-%s" (include "platform-workload.fullname" $) $name) }}
  namespace: {{ include "platform-workload.namespace" $ }}
  labels:
    {{- include "platform-workload.labels" $ | nindent 4 }}
data:
  {{- range $key, $value := $config.data }}
  {{ $key }}: |
{{ tpl ($value | toString) $ | nindent 4 }}
  {{- end }}
{{- end }}
