{{- $root := . -}}
{{- range $name, $route := .Values.routes }}
{{- if or (not (hasKey $route "enabled")) $route.enabled }}
{{- $hostRules := $route.hosts | default (list (dict "host" $route.host "rules" $route.rules)) }}
{{- range $hostConfig := $hostRules }}
{{- range $rule := $hostConfig.rules }}
{{- if ne (include "platform-workload.hasService" (dict "root" $root "name" $rule.service) | trim) "true" }}{{ fail (printf "route %s references missing service %s" $name $rule.service) }}{{ end }}
{{- end }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $route.name | default (printf "%s-%s" (include "platform-workload.fullname" $root) $name) }}
  namespace: {{ include "platform-workload.namespace" $root }}
  labels:
    {{- include "platform-workload.labels" $root | nindent 4 }}
  {{- with $route.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $route.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $route.tls }}
  tls:
{{ toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $hostConfig := $hostRules }}
    - host: {{ required (printf "routes.%s.host is required" $name) $hostConfig.host }}
      http:
        paths:
          {{- range $rule := $hostConfig.rules }}
          - path: {{ required "route path is required" $rule.path }}
            pathType: {{ $rule.pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "platform-workload.fullname" $root }}-{{ $rule.service }}
                {{- if $rule.portName }}
                port: {name: {{ $rule.portName }}}
                {{- else }}
                {{- if or (lt (int $rule.port) 1) (gt (int $rule.port) 65535) }}{{ fail "route port must be between 1 and 65535" }}{{ end }}
                port: {number: {{ required "route port is required" $rule.port }}}
                {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
{{- end }}
