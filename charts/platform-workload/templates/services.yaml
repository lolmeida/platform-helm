{{- $root := . -}}
{{- range $name, $service := .Values.services }}
{{- if or (not (hasKey $service "enabled")) $service.enabled }}
{{ include "platform-workload.renderService" (dict "root" $root "name" $name "service" $service) }}
{{- end }}
{{- end }}
{{- if $root.Values.servicesFromWorkloads }}
{{- range $workloadName, $workload := $root.Values.workloads }}
{{- $effective := include "platform-workload.effectiveWorkload" (dict "root" $root "name" $workloadName "workload" $workload) | fromYaml }}
{{- with $effective.service }}
{{- if or (not (hasKey . "enabled")) .enabled }}
{{- $serviceName := .name | default $workloadName }}
{{- if hasKey $root.Values.services $serviceName }}{{ fail (printf "generated service %s conflicts with explicit service" $serviceName) }}{{ end }}
{{- $generatedService := deepCopy . }}
{{- $_ := set $generatedService "workload" $workloadName }}
{{ include "platform-workload.renderService" (dict "root" $root "name" $serviceName "service" $generatedService) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
