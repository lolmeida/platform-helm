servicesFromWorkloads: true
profiles:
  quarkus-api:
    replicas: 2
    containerPort: 8080
    env:
      PROFILE_ENV: from-profile
      OVERRIDE_ENV: from-profile
    service:
      name: public-api
      port: 8080
    probes:
      readiness:
        path: /q/health/ready
workloads:
  api:
    profile: quarkus-api
    image:
      repository: example/api
      tag: v1
    env:
      OVERRIDE_ENV: from-workload
      WORKLOAD_ENV: present
routes:
  api:
    host: example.test
    rules:
      - path: /
        service: public-api
        port: 8080
monitoring:
  api:
    service: public-api
    path: /metrics
